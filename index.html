<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trip Invite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="question">Wanna go on a trip with me? ✈️</h1>
    <img id="bear-gif" src="https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif" alt="Cute Bear">

    <div class="buttons" id="initial-buttons">
      <button id="yes-btn">Yes!</button>
      <button id="no-btn">No</button>
    </div>

    <div class="trip-options" id="trip-options" style="display: none;">
      <p class="subtitle">Which day works best for our trip?</p>
      <button class="trip-btn" onclick="selectDay('31 January')">31 January</button>
      <button class="trip-btn" onclick="selectDay('28 Feburary')">28 Feburary</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
